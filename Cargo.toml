[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
opencadcodec = { git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "a35f43e", features = ["serde"] }
# 2D curve geometry for snaps (MPL-2.0, same author as the codec). Only the `geom2d` layer.
opencadkernel = { git = "https://github.com/HakanSeven12/opencadkernel.git", rev = "99b6b48", default-features = false, features = ["geom2d", "offset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON schemas of the commands, generated from the enum (MIT): the command registry.
schemars = "1.2"
# The record types' formats, traced from their serde (MIT OR Apache-2.0): `record_schema`.
serde-reflection = "0.6"
# Which field of a record an edit broke (MIT OR Apache-2.0): `SetRecords`.
serde_path_to_error = "0.1"
thiserror = "2"
tauri = "2.11"
tauri-build = "2.6"
tauri-plugin-dialog = "2.7"
rstar = "0.13"
rust_xlsxwriter = "0.99"
calamine = "0.36"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
# 2D rasteriser for the drawing pictures the AI looks at (BSD-3-Clause).
tiny-skia = "0.12"
# Text in the viewport: shaping (MIT), glyph rasterising (Apache-2.0), bidi order (MIT/Apache-2.0).
rustybuzz = "0.20"
ab_glyph = "0.2"
unicode-bidi = "0.3"

# Dependencies (the DWG reader above all) and the two hot crates that flatten and batch the
# drawing are optimised in dev builds too, so `pnpm tauri dev` draws big drawings in about a second
# instead of 20 s. The other Qiyas crates stay debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.qiyas-geom]
opt-level = 3

[profile.dev.package.qiyas-render]
opt-level = 3
# One codegen unit: split across units, rstar's bulk load in the pick index runs about 4 times
# slower (1.6 s against 0.35 s on a 1.4 M-segment drawing). Guarded by the release test
# `pick_index_one_million_segments_relative_to_reference` (a fixed integer-sort reference;
# also checks that the ratio budget cannot hide a 4x slowdown).
codegen-units = 1

[profile.release.package.qiyas-render]
codegen-units = 1
