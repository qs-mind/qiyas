<!doctype html>
<html lang="en">

    <title>Qiyas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The first frame is the theme's own background (--bg: Paper, Ink in dark), not the web view's
         white, until theme.css arrives. theme-init.js sets data-theme before the first paint. -->

      html { background: #f9f8f4; }
      html[data-theme="dark"] { background: #0e0f12; }
    </style>
    <script src="/theme-init.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
