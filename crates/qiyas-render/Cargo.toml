[package]
name = "qiyas-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
unicode-linebreak = "0.1"
unicode-general-category = "1.1"
unicode-script = "0.5"
unicode-segmentation = "1.13"
fontdb = "0.24"
opencadcodec.workspace = true
# Triangulating fills (hatches, solids, wipeouts).
opencadkernel.workspace = true
qiyas-geom = { path = "../qiyas-geom" }
rstar.workspace = true
rustybuzz.workspace = true
ab_glyph.workspace = true
unicode-bidi.workspace = true

[dev-dependencies]
# Dev-only, for the sample drawing: qiyas-core depends on qiyas-render, never the other way.
qiyas-core = { path = "../qiyas-core", features = ["fixtures"] }
