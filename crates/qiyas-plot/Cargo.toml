[package]
name = "qiyas-plot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
opencadcodec.workspace = true
qiyas-core = { path = "../qiyas-core" }
qiyas-geom = { path = "../qiyas-geom" }
qiyas-render = { path = "../qiyas-render" }
# Writing the PDF (MIT), without its date and thread-pool features.
lopdf = { version = "0.45", default-features = false }
# Glyph subsets of the TrueType fonts the PDF embeds (MIT OR Apache-2.0); TrueType and CFF only.
subsetter = { version = "0.2", default-features = false }
# Font metrics and glyph outlines (MIT OR Apache-2.0), the version rustybuzz already brings.
ttf-parser = "0.25"
# zlib for CTB and STB plot style files (MIT OR Apache-2.0).
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# The user's id, for the print spool's private folder (MIT OR Apache-2.0).
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
qiyas-core = { path = "../qiyas-core", features = ["fixtures"] }
