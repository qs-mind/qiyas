[package]
# Tests are listed below: one binary for all, see tests/all.rs.
autotests = false
name = "qiyas-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.clippy]
await_holding_lock = "deny"

[dependencies]
strsim = "0.11"
eventsource-stream = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
qiyas-boq = { path = "../qiyas-boq" }
qiyas-core = { path = "../qiyas-core" }
qiyas-pdf = { path = "../qiyas-pdf" }
qiyas-ocr = { path = "../qiyas-ocr" }
qiyas-plot = { path = "../qiyas-plot" }
qiyas-render = { path = "../qiyas-render" }
qiyas-takeoff = { path = "../qiyas-takeoff" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
# HTTPS to the AI provider. rustls with the `ring` crypto provider (Apache-2.0 AND ISC) rather
# than reqwest's default aws-lc-rs, which needs a C/CMake build and carries the OpenSSL licence.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "sync", "time", "rt", "net", "process", "io-util"] }
tokio-util = "0.7"
base64 = "0.23"
# Process signals (MIT OR Apache-2.0); never invoke a shell to cancel Claude Code.
libc = "0.2"
# PKCE, OS randomness and ID-token signature validation (already in rustls's dependency tree).
ring = "0.17"
url = "2"
# Local time for the agent log (MIT OR Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The MCP server: rmcp (Apache-2.0) over Streamable HTTP, served by axum (MIT) on 127.0.0.1.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }

[dev-dependencies]
qiyas-pdf = { path = "../qiyas-pdf", features = ["fixtures"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
opencadcodec.workspace = true
rust_xlsxwriter.workspace = true
tempfile.workspace = true
qiyas-core = { path = "../qiyas-core", features = ["fixtures"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "clinic_performance"
path = "tests/clinic_performance.rs"

[[test]]
name = "villa_openings"
path = "tests/villa_openings.rs"
