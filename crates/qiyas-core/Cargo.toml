[package]
# Tests are listed below: one binary for all, see tests/all.rs.
autotests = false
name = "qiyas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
opencadcodec.workspace = true
opencadkernel.workspace = true
qiyas-geom = { path = "../qiyas-geom" }
qiyas-param = { path = "../qiyas-param" }
qiyas-pdf = { path = "../qiyas-pdf" }
qiyas-render = { path = "../qiyas-render" }
# Raster images (MIT OR Apache-2.0): only the formats Qiyas attaches, so no AVIF/EXR encoders or
# rayon come along. png, zune-jpeg, tiff and image-webp are MIT or Apache-2.0.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
regex = "1" # MIT OR Apache-2.0; bounded, non-backtracking recognition patterns.
schemars.workspace = true
serde.workspace = true
serde-reflection.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

# Crash recovery: whether a lock file's process is alive (`kill(pid, 0)`) and the computer's
# name (MIT OR Apache-2.0). Windows uses std only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Integration tests don't see the library's cfg(test), so they turn the fixtures on this way.
qiyas-core = { path = ".", features = ["fixtures"] }
qiyas-pdf = { path = "../qiyas-pdf", features = ["fixtures"] }
qiyas-render = { path = "../qiyas-render" }

[features]
fixtures = []

[[test]]
name = "all"
path = "tests/all.rs"
